services:
  - type: web
    name: vocard-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-chat.txt
    startCommand: uvicorn vocard.chat:create_chat_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: VOCARD_EXPRESSION_SOURCE_URL
        value: https://english-scrapper.onrender.com
      - key: VOCARD_FIREBASE_PROJECT_ID
        value: vocard-6f1a5
      - key: VOCARD_FIREBASE_WEB_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VOCARD_CHAT_PROVIDER
        value: ollama
      - key: VOCARD_OLLAMA_BASE_URL
        value: https://ollama.com
      - key: VOCARD_CHAT_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: VOCARD_CHAT_USERNAME
        value: vocard
      - key: VOCARD_CHAT_PASSWORD
        generateValue: true
